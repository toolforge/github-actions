name: build and push

on:
  workflow_call:
    inputs:
      imagename:
        required: true
        type: string
    secrets:
      quay_user:
        required: true
      quay_password:
        required: true

jobs:
  build_and_push:
    # Pull requests from forks get no secrets; push the branch to the
    # repository itself to build its images.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.quay_user }}
          password: ${{ secrets.quay_password }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          push: true
          context: images/${{ inputs.imagename }}
          tags: quay.io/wikimedia-paws-prod/${{ inputs.imagename }}:pr-${{ github.event.number }}

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
